name: Build & Push Images to GHCR

on:
  push:
    branches: [main]
    paths:
      - "stitch_clientos_ai/clientos-ai/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      nextPublicApiUrl:
        description: "NEXT_PUBLIC_API_URL baked into the web bundle"
        required: false
        default: "/api"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MONOREPO: stitch_clientos_ai/clientos-ai

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: stitch_clientos_ai/clientos-ai
            dockerfile: apps/web/Dockerfile
            buildArgs: |
              NEXT_PUBLIC_API_URL=${{ github.event.inputs.nextPublicApiUrl || vars.NEXT_PUBLIC_API_URL || '/api' }}
              NEXT_PUBLIC_SCRAPER_URL=${{ vars.NEXT_PUBLIC_SCRAPER_URL }}
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
              NEXT_PUBLIC_CESIUM_ION_TOKEN=${{ vars.NEXT_PUBLIC_CESIUM_ION_TOKEN }}
          - service: api
            context: stitch_clientos_ai/clientos-ai
            dockerfile: apps/api/Dockerfile
            buildArgs: ""
          - service: worker
            context: stitch_clientos_ai/clientos-ai
            dockerfile: apps/worker/Dockerfile
            buildArgs: ""
          - service: ai-service
            context: stitch_clientos_ai/clientos-ai/apps/ai-service
            dockerfile: apps/ai-service/Dockerfile
            buildArgs: ""
          - service: scraper
            context: stitch_clientos_ai/clientos-ai/apps/scraper
            dockerfile: apps/scraper/Dockerfile
            buildArgs: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase registry owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/clientos-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ env.MONOREPO }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.buildArgs }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
