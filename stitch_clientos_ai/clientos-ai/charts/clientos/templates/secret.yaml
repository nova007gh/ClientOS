apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clientos.secretName" . }}
  labels:
    {{- include "clientos.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "clientos.databaseUrl" . | quote }}
  REDIS_URL: {{ include "clientos.redisUrl" . | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  AI_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  AI_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  MICROSOFT_CLIENT_ID: {{ .Values.secrets.microsoftClientId | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.secrets.microsoftClientSecret | quote }}
  PAYSTACK_SECRET_KEY: {{ .Values.secrets.paystackSecretKey | quote }}
  PAYSTACK_PUBLIC_KEY: {{ .Values.secrets.paystackPublicKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  BUSINESS_DATA_PROVIDER: {{ .Values.secrets.businessDataProvider | quote }}
  BUSINESS_DATA_API_KEY: {{ .Values.secrets.businessDataApiKey | quote }}
  S3_ENDPOINT: {{ .Values.secrets.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.secrets.s3Bucket | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
