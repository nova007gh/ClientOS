{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clientos.fullname" . }}-api
  labels:
    {{- include "clientos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "clientos.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clientos.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- include "clientos.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- include "clientos.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "clientos.image" (dict "root" . "service" .Values.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3001"
            - name: CORS_ORIGIN
              value: {{ include "clientos.corsOrigin" . | quote }}
            - name: AI_SERVICE_URL
              value: "http://{{ include "clientos.fullname" . }}-ai-service:8002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clientos.secretName" . }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clientos.secretName" . }}
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "clientos.secretName" . }}
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "clientos.secretName" . }}
                  key: ENCRYPTION_KEY
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clientos.fullname" . }}-api
  labels:
    {{- include "clientos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "clientos.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- end }}
